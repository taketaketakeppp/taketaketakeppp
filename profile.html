<!DOCTYPE html>

<body>

<header>
    <a href="index.html">
        <div class="logo">ae<span>spa</span></div>
    </a>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
<div class="slide-menu" id="slideMenu">

    <nav>
      <a href="index.html">HOME</a>
      <a href="news.html">NEWS</a>
      <a href="profile.html">PROFILE</a>
      <a href="discography.html">DISCOGRAPHY</a>
      <a href="#">MOVIE</a>
      <a href="#">GALLERY</a>
    </nav>

    <button class="login-btn">FANCLUB</button>
</header>

<section class="profile-page">

    <div class="profile-left">

        <h1>MEMBER PROFILES</h1>

        <div class="member-list">

            <div class="member active"
                 data-img="img/profile_karina.png"
                 data-name="KARINA"
                 data-role="Leader / Main Dancer"
                 data-desc="aespaのリーダー。圧倒的ビジュアルとパフォーマンス">
                KARINA
            </div>

            <div class="member"
                 data-img="img/profile_giselle.png"
                 data-name="GISELLE"
                 data-role="Main Rapper"
                 data-desc="ラップと歌のバランスが強いメンバー">
                GISELLE
            </div>

            <div class="member"
                 data-img="img/profile_winter.png"
                 data-name="WINTER"
                 data-role="Lead Vocal"
                 data-desc="透明感のあるボーカル">
                WINTER
            </div>

            <div class="member"
                 data-img="img/profile_ningning.png"
                 data-name="NINGNING"
                 data-role="Main Vocal"
                 data-desc="圧倒的な声量とパフォーマンス">
                NINGNING
            </div>

        </div>

    </div>

    <div class="profile-right">

        <img
            id="memberImage"
            src="img/profile_karina.png"
            alt="KARINA">

        <div class="member-detail">

            <h2 id="memberName">KARINA</h2>

            <p id="memberRole">Leader / Main Dancer</p>

        </div>

    </div>

</section>

<!-- モーダル -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span id="modalClose" class="modal-close">×</span>

        <img id="modalImage" src="" alt="">
        <h2 id="modalName"></h2>
        <p id="modalRole"></p>
        <p id="modalDesc"></p>

        <!-- 矢印ナビ -->
        <span id="modalPrev" class="modal-arrow left">◀</span>
        <span id="modalNext" class="modal-arrow right">▶</span>
    </div>
</div>
<footer>

    <div class="footer-inner">

        <div>
